# 記事の公開・改修で prerendered/ を自動再生成する。
#
# なぜ必要か:
#   パイプラインの公開ワーカは、改稿を反映するとき古い prerendered スナップショットを
#   削除する。残したままだと改稿前のHTMLが配信され続けるため、この削除は正しい。
#   一方で再生成は `npm run build:full` をローカルで回す前提になっており、
#   自動では走らない。結果、公開直後の記事は prerendered/ が欠けた状態になり、
#   JSを実行しないクローラにはSPAシェル (約4.6KB) しか届かない。
#   2026-07-31に実際に4本がこの状態で公開された。
#
# ループ防止:
#   このワークフロー自身のコミットでは再実行しない (paths に prerendered/ を含めない +
#   コミットメッセージで判定)。
name: prerender (公開後の静的HTML再生成)

on:
  push:
    branches: [main]
    paths:
      - "content/blog/**"
      - "build.js"
      - "articles.js"
      - "build-prerender.js"
      # メタ情報・構造化データ・ページ本体は *.jsx が生成する。ここを外していたため、
      # app.jsx を直しても静的HTMLは古いまま配信され続ける状態だった
      - "*.jsx"
      - "styles.css"
      # 次ページ提案 (nq) の文言・承認・カタログ。build.js が app.bundle.js と articles.js に焼き込み、
      # スナップショットにはデフォルトのカードとして入る。ここを外すと、文言を承認しても
      # 静的HTMLには古いカード (または何も無い状態) が残り続ける
      - "data/**"
  workflow_dispatch:

concurrency:
  group: prerender
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prerender:
    # 自分自身が作ったコミットでは回さない (無限ループ防止)
    if: "!contains(github.event.head_commit.message, '[prerender]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build-prerender.js は playwright のヘッドレスChromiumで各ルートを描画する
      - run: npx playwright install --with-deps chromium
      - name: ビルド + プリレンダ
        run: npm run build:full
      - name: 差分があればコミット
        run: |
          set -euo pipefail
          git config user.name "nortiq-prerender"
          git config user.email "noreply@nortiqlab.com"
          # プリレンダは約5分かかる。その間に公開ワーカが次の記事をpushすると
          # こちらのHEADが古くなり、pushがfast-forwardできず弾かれる。
          # 2026-09-11に7本を連続公開した際に実際に発生し、記事が静的HTMLなしで
          # 公開された。最新mainの上に生成物を載せ直して再試行する。
          for attempt in 1 2 3; do
            git add prerendered
            if git diff --cached --quiet; then
              echo "prerendered/ に差分なし"
              exit 0
            fi
            CHANGED=$(git diff --cached --name-only | wc -l)
            git commit -m "build: prerenderを再生成 (${CHANGED}ファイル) [prerender]"
            if git push; then
              exit 0
            fi
            echo "pushが弾かれました。最新mainを取り込んで再試行します (${attempt}/3)"
            git fetch origin main
            # HEADとindexを最新mainに合わせる (--softだとindexが古いままのため、
            # 先行コミットが追加したファイルを消すコミットになってしまう)。
            # 作業ツリーのprerendered/はそのまま残るので、次の周回で
            # 「最新main + 今回の生成物」だけが載る。マージ解決は不要。
            git reset -q origin/main
          done
          echo "::error::3回試行しましたがpushできませんでした"
          exit 1
