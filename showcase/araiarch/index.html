    // document mints the blobs for its OWN frames, obtaining page text

      // root's never-relay rule) are what hold in fully opaque chains

    // consumers read these Blobs directly. Survives the swap like the error sink.

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

        }
      }

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];

        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r-spacing:.2em;color:rgba(0,0,0,.45)\">2018<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"profile\" data-screen-label=\"Profile\" style=\"padding:0 var(--pg) var(--sec);scroll-margin-top:120px\">\n  <div data-fade=\"\" style=\"display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gap)\">\n    <div style=\"grid-column:1 / span 2\">\n      <div style=\"font-size:10px;font-weight:300;letter-spacing:.34em;text-transform:uppercase\">Profile<\u002Fdiv>\n      <sc-if value=\"{{ ja }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-size:10px;font-weight:200;letter-spacing:.2em;color:rgba(0,0,0,.42);padding-top:10px\">概要<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"grid-column:4 / span 6;display:flex;flex-direction:column;gap:40px\">\n      <p style=\"margin:0;font-size:15px;font-weight:200;line-height:2.15;letter-spacing:.02em;text-wrap:pretty\">ARAI ARCHITECTS is a Tokyo practice founded in 2011. The office works on houses, small public buildings and interiors, and begins each project from the light, the air and the quiet already present on the site.<\u002Fp>\n      <p style=\"margin:0;font-size:15px;font-weight:200;line-height:2.15;letter-spacing:.02em;text-wrap:pretty\">Drawings are made slowly. Details are reduced until only what the building needs remains.<\u002Fp>\n      <sc-if value=\"{{ ja }}\" hint-placeholder-val=\"{{ true }}\">\n        <p style=\"margin:0;font-size:13px;font-weight:200;line-height:2.4;letter-spacing:.06em;color:rgba(0,0,0,.55);text-wrap:pretty\">光と空気、そして敷地にすでにある静けさから設計をはじめます。住宅、小さな公共建築、インテリア。<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-fade=\"\" style=\"display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gap);padding-top:calc(var(--sec) * .5);transition-delay:.15s\">\n    <div style=\"grid-column:4 / span 8;display:grid;grid-template-columns:repeat(4,1fr);column-gap:var(--gap);row-gap:52px\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <span style=\"font-size:9px;font-weight:300;letter-spacing:.3em;text-transform:uppercase;color:rgba(0,0,0,.42)\">Founded<\u002Fspan>\n        <span style=\"font-size:12px;font-weight:200;letter-spacing:.12em\">2011<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <span style=\"font-size:9px;font-weight:300;letter-spacing:.3em;text-transform:uppercase;color:rgba(0,0,0,.42)\">Principal<\u002Fspan>\n        <span style=\"font-size:12px;font-weight:200;letter-spacing:.12em\">Ryo Arai<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <span style=\"font-size:9px;font-weight:300;letter-spacing:.3em;text-transform:uppercase;color:rgba(0,0,0,.42)\">Location<\u002Fspan>\n        <span style=\"font-size:12px;font-weight:200;letter-spacing:.12em\">Tokyo<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <span style=\"font-size:9px;font-weight:300;letter-spacing:.3em;text-transform:uppercase;color:rgba(0,0,0,.42)\">Staff<\u002Fspan>\n        <span style=\"font-size:12px;font-weight:200;letter-spacing:.12em\">6<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" data-screen-label=\"Contact\" style=\"padding:0 var(--pg) calc(var(--sec) * .6);scroll-margin-top:120px\">\n  <div data-fade=\"\" style=\"display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gap)\">\n    <div style=\"grid-column:1 / span 2\">\n      <div style=\"font-size:10px;font-weight:300;letter-spacing:.34em;text-transform:uppercase\">Contact<\u002Fdiv>\n      <sc-if value=\"{{ ja }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-size:10px;font-weight:200;letter-spacing:.2em;color:rgba(0,0,0,.42);padding-top:10px\">連絡先<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"grid-column:4 / span 6;display:flex;flex-direction:column;gap:34px\">\n      <a href=\"mailto:studio@araiarchitects.jp\" style=\"font-size:15px;font-weight:200;letter-spacing:.1em\">studio@araiarchitects.jp<\u002Fa>\n      <span style=\"font-size:15px;font-weight:200;letter-spacing:.1em\">+81 3 5432 1098<\u002Fspan>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-size:13px;font-weight:200;line-height:1.9;letter-spacing:.08em;color:rgba(0,0,0,.55)\">2-14-3 Yanaka, Taito-ku, Tokyo 110-0001<\u002Fspan>\n        <sc-if value=\"{{ ja }}\" hint-placeholder-val=\"{{ true }}\">\n          <span style=\"font-size:12px;font-weight:200;line-height:1.9;letter-spacing:.1em;color:rgba(0,0,0,.42)\">東京都台東区谷中 2-14-3<\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"padding:0 var(--pg) 64px;display:flex;justify-content:space-between;align-items:baseline\">\n  <span style=\"font-size:9px;font-weight:200;letter-spacing:.26em;text-transform:uppercase;color:rgba(0,0,0,.35)\">© 2026 ARAI ARCHITECTS<\u002Fspan>\n  <a href=\"#top\" style=\"font-size:9px;font-weight:200;letter-spacing:.26em;text-transform:uppercase;color:rgba(0,0,0,.35)\">Top<\u002Fa>\n<\u002Ffooter>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;showJapanese&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Content&quot; },\n  &quot;whitespace&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;extreme&quot;, &quot;generous&quot;, &quot;compact&quot;], &quot;default&quot;: &quot;extreme&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Layout&quot; },\n  &quot;heroScale&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;min&quot;: 40, &quot;max&quot;: 80, &quot;step&quot;: 5, &quot;default&quot;: 60, &quot;unit&quot;: &quot;%&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Layout&quot; },\n  &quot;fadeIn&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Motion&quot; }\n}\">\nclass Component extends DCLogic {\n  applyVars() {\n    const scales = {\n      extreme:  { pg: '10vw', sec: '280px', gap: '6.5vw', rows: '210px' },\n      generous: { pg: '8vw',  sec: '190px', gap: '4.5vw', rows: '140px' },\n      compact:  { pg: '6vw',  sec: '120px', gap: '3vw',   rows: '90px'  }\n    };\n    const v = scales[this.props.whitespace] || scales.extreme;\n    const r = document.documentElement.style;\n    r.setProperty('--pg', v.pg);\n    r.setProperty('--sec', v.sec);\n    r.setProperty('--gap', v.gap);\n    r.setProperty('--rows', v.rows);\n    r.setProperty('--hero', (this.props.heroScale ?? 60) + '%');\n  }\n\n  reveal(all) {\n    const els = Array.prototype.slice.call(document.querySelectorAll('[data-fade]:not(.in)'));\n    if (!els.length) { clearInterval(this._tick); this._tick = null; return; }\n    const h = window.innerHeight || document.documentElement.clientHeight || 800;\n    els.forEach(e => {\n      if (all) { e.classList.add('in'); return; }\n      const r = e.getBoundingClientRect();\n      if (r.top < h * 0.94 && r.bottom > -80) e.classList.add('in');\n    });\n  }\n\n  observe() {\n    if (this.props.fadeIn === false) {\n      this.reveal(true);\n      return;\n    }\n    this.reveal();\n    if (this._bound) return;\n    this._bound = () => this.reveal();\n    window.addEventListener('scroll', this._bound, { capture: true, passive: true });\n    window.addEventListener('resize', this._bound, { passive: true });\n    this._tick = setInterval(this._bound, 250);\n    // if nothing at all has appeared after a moment, the measurement context is\n    // unusual — show everything rather than leave a blank page\n    this._safety = setTimeout(() => {\n      if (!document.querySelector('[data-fade].in')) this.reveal(true);\n    }, 2500);\n  }\n\n  sync() {\n    this.applyVars();\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.observe(), 60);\n  }\n\n  componentDidMount() { this.sync(); }\n  componentDidUpdate() { this.sync(); }\n  componentWillUnmount() {\n    if (this._bound) {\n      window.removeEventListener('scroll', this._bound, { capture: true });\n      window.removeEventListener('resize', this._bound);\n    }\n    clearInterval(this._tick);\n    clearTimeout(this._t);\n    clearTimeout(this._safety);\n  }\n\n  renderVals() {\n    return { ja: this.props.showJapanese !== false };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
