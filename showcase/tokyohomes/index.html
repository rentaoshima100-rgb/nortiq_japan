    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};

    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

      }

    function ownFrameWindows() {

      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document

        }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:700;padding:13px 18px;letter-spacing:0.04em;white-space:nowrap;transition:background .2s\" style-hover=\"background:#0A0A0A;color:#fff\">無料査定を依頼<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"top\" style=\"max-width:1320px;margin:0 auto;padding:clamp(48px,6vw,88px) clamp(20px,4vw,56px) 0\">\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:56px;flex-wrap:wrap\">\n      <div style=\"flex:1 1 620px;min-width:320px\">\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:26px\">\n          <span style=\"width:28px;height:1px;background:#1F4FD8;display:block\"><\u002Fspan>\n          <span style=\"font-size:11px;font-weight:600;letter-spacing:0.24em;color:#1F4FD8\">TOKYO CENTRAL / REAL ESTATE BROKERAGE<\u002Fspan>\n        <\u002Fdiv>\n        <h1 style=\"margin:0;font-size:clamp(38px,5.4vw,74px);font-weight:700;line-height:1.1;letter-spacing:-0.01em;text-wrap:balance\">都心の一邸を、<br>正確な価格で。<\u002Fh1>\n        <p style=\"margin:26px 0 0;max-width:560px;font-size:15px;line-height:2;color:#4A4E58;text-wrap:pretty\">港区・渋谷区・目黒区を中心とした中古マンションの売買仲介。近隣の成約事例にもとづく査定書を、最短当日でお渡しします。<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:0;flex:0 0 auto\">\n        <div style=\"padding:0 28px 4px 0;border-right:1px solid #E4E6EC\">\n          <div style=\"font-size:10px;letter-spacing:0.2em;color:#797E8A;margin-bottom:8px\">AREAS<\u002Fdiv>\n          <div style=\"font-size:30px;font-weight:700;letter-spacing:-0.01em\">12<span style=\"font-size:14px;font-weight:400;margin-left:3px\">区<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:0 28px 4px;border-right:1px solid #E4E6EC\">\n          <div style=\"font-size:10px;letter-spacing:0.2em;color:#797E8A;margin-bottom:8px\">AVG. DAYS<\u002Fdiv>\n          <div style=\"font-size:30px;font-weight:700;letter-spacing:-0.01em\">45<span style=\"font-size:14px;font-weight:400;margin-left:3px\">日<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:0 0 4px 28px\">\n          <div style=\"font-size:10px;letter-spacing:0.2em;color:#797E8A;margin-bottom:8px\">APPRAISAL<\u002Fdiv>\n          <div style=\"font-size:30px;font-weight:700;letter-spacing:-0.01em\">最短当日<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:stretch;margin-top:clamp(40px,5vw,64px);flex-wrap:wrap\">\n      <a href=\"#area\" style=\"flex:1 1 380px;background:#0A0A0A;color:#fff;min-height:300px;display:flex;flex-direction:column;justify-content:space-between;padding:40px 104px 36px 44px;clip-path:polygon(0 0, 100% 0, calc(100% - 56px) 100%, 0 100%);transition:background .25s\" style-hover=\"background:#191B21\">\n        <div>\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:0.24em;color:#8A8F9C;margin-bottom:20px\">01 &nbsp;BUY<\u002Fdiv>\n          <div style=\"font-size:clamp(34px,3.6vw,50px);font-weight:700;line-height:1.15;letter-spacing:0.02em\">買いたい<\u002Fdiv>\n          <p style=\"margin:16px 0 0;font-size:14px;line-height:1.95;color:#B7BBC5;max-width:340px\">非公開物件を含む都心マンションを、ご予算と利回りの条件からご提案します。<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:14px;margin-top:28px\">\n          <span style=\"width:46px;height:46px;border:1px solid #3A3E48;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px\">→<\u002Fspan>\n          <span style=\"font-size:13px;font-weight:700;letter-spacing:0.06em;white-space:nowrap\">物件を探す<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n      <a href=\"#contact\" style=\"flex:1 1 380px;background:#1F4FD8;color:#fff;min-height:300px;display:flex;flex-direction:column;justify-content:space-between;padding:40px 44px 36px 104px;clip-path:polygon(56px 0, 100% 0, 100% 100%, 0 100%);transition:background .25s\" style-hover=\"background:#1841B5\">\n        <div>\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:0.24em;color:#B9C8F5;margin-bottom:20px\">02 &nbsp;SELL<\u002Fdiv>\n          <div style=\"font-size:clamp(34px,3.6vw,50px);font-weight:700;line-height:1.15;letter-spacing:0.02em\">売りたい<\u002Fdiv>\n          <p style=\"margin:16px 0 0;font-size:14px;line-height:1.95;color:#D6DEFA;max-width:340px\">成約事例と現在の売出動向にもとづく査定書を、最短当日でお渡しします。<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:14px;margin-top:28px\">\n          <span style=\"width:46px;height:46px;border:1px solid #6C8AE8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px\">→<\u002Fspan>\n          <span style=\"font-size:13px;font-weight:700;letter-spacing:0.06em;white-space:nowrap\">無料査定を依頼<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"area\" style=\"max-width:1320px;margin:0 auto;padding:clamp(72px,8vw,128px) clamp(20px,4vw,56px) 0;scroll-margin-top:80px\">\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap;padding-bottom:28px;border-bottom:1px solid #0A0A0A\">\n      <div>\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.24em;color:#1F4FD8;margin-bottom:16px\">01 &nbsp;AREA MARKET<\u002Fdiv>\n        <h2 style=\"margin:0;font-size:clamp(28px,3.4vw,44px);font-weight:700;letter-spacing:0.01em;line-height:1.25\">人気エリアの相場<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:#797E8A;line-height:1.9;text-align:right\">中古マンション／2026年7月時点<br>㎡単価は成約ベースの中央値<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1px;background:#E4E6EC;border:1px solid #E4E6EC;border-top:0\">\n      <sc-for list=\"{{ areas }}\" as=\"a\" hint-placeholder-count=\"6\">\n        <div style=\"background:#fff;padding:30px 28px 26px;transition:background .2s\" style-hover=\"background:#F7F8FA\">\n          <div style=\"display:flex;align-items               <div style=\"font-size:15px;font-weight:700;white-space:nowrap\">{{ a.band }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top:16px;font-size:11px;color:#A2A7B2\">※ 掲載の相場・実績は本サイト制作用のサンプルデータです。<\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"flow\" style=\"margin-top:clamp(72px,8vw,128px);background:#0A0A0A;color:#fff;scroll-margin-top:72px\">\n    <div style=\"max-width:1320px;margin:0 auto;padding:clamp(64px,7vw,104px) clamp(20px,4vw,56px)\">\n      <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap;margin-bottom:56px\">\n        <div>\n          <div style=\"font-size:11px;font-weight:600;letter-spacing:0.24em;color:#6C8AE8;margin-bottom:16px\">02 &nbsp;SELLING PROCESS<\u002Fdiv>\n          <h2 style=\"margin:0;font-size:clamp(28px,3.4vw,44px);font-weight:700;letter-spacing:0.01em;line-height:1.25\">売却の流れ<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin:0;max-width:400px;font-size:14px;line-height:2;color:#9DA2AE\">査定から引渡しまで、担当者が一貫して対応します。平均的な所要期間は約3か月です。<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px\">\n        <div style=\"background:#0A0A0A;border:1px solid #24262C;padding:30px 28px 34px\">\n          <div style=\"font-size:52px;font-weight:700;color:#1F4FD8;line-height:1;letter-spacing:-0.02em\">01<\u002Fdiv>\n          <div style=\"font-size:20px;font-weight:700;margin-top:20px\">無料査定<\u002Fdiv>\n          <div style=\"font-size:11px;letter-spacing:0.16em;color:#6C8AE8;margin-top:8px\">最短当日<\u002Fdiv>\n          <p style=\"margin:14px 0 0;font-size:13px;line-height:2;color:#9DA2AE\">近隣の成約事例と現在の売出物件を照合し、根拠を明記した査定書をお渡しします。<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#0A0A0A;border:1px solid #24262C;padding:30px 28px 34px\">\n          <div style=\"font-size:52px;font-weight:700;color:#1F4FD8;line-height:1;letter-spacing:-0.02em\">02<\u002Fdiv>\n          <div style=\"font-size:20px;font-weight:700;margin-top:20px\">媒介契約・販売開始<\u002Fdiv>\n          <div style=\"font-size:11px;letter-spacing:0.16em;color:#6C8AE8;margin-top:8px\">1〜2週間<\u002Fdiv>\n          <p style=\"margin:14px 0 0;font-size:13px;line-height:2;color:#9DA2AE\">価格戦略と広告計画をご提示。写真撮影・図面作成まで当社が負担します。<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#0A0A0A;border:1px solid #24262C;padding:30px 28px 34px\">\n          <div style=\"font-size:52px;font-weight:700;color:#1F4FD8;line-height:1;letter-spacing:-0.02em\">03<\u002Fdiv>\n          <div style=\"font-size:20px;font-weight:700;margin-top:20px\">内見・条件交渉<\u002Fdiv>\n          <div style=\"font-size:11px;letter-spacing:0.16em;color:#6C8AE8;margin-top:8px\">平均45日<\u002Fdiv>\n          <p style=\"margin:14px 0 0;font-size:13px;line-height:2;color:#9DA2AE\">反響数と内見数を毎週レポート。数字にもとづき価格の見直しを判断します。<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#0A0A0A;border:1px solid #24262C;padding:30px 28px 34px\">\n          <div style=\"font-size:52px;font-weight:700;color:#1F4FD8;line-height:1;letter-spacing:-0.02em\">04<\u002Fdiv>\n          <div style=\"font-size:20px;font-weight:700;margin-top:20px\">契約・決済・引渡し<\u002Fdiv>\n          <div style=\"font-size:11px;letter-spacing:0.16em;color:#6C8AE8;margin-top:8px\">約1か月<\u002Fdiv>\n          <p style=\"margin:14px 0 0;font-size:13px;line-height:2;color:#9DA2AE\">融資・税務・登記の各手続きを調整し、引渡し当日まで担当者が同席します。<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"members\" style=\"max-width:1320px;margin:0 auto;padding:clamp(72px,8vw,128px) clamp(20px,4vw,56px) 0;scroll-margin-top:80px\">\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap;margin-bottom:44px\">\n      <div>\n        <div style=\"font-size:11px;font-weight:600;letter-spacing:0.24em;color:#1F4FD8;margin-bottom:16px\">03 &nbsp;MEMBERS<\u002Fdiv>\n        <h2 style=\"margin:0;font-size:clamp(28px,3.4vw,44px);font-weight:700;letter-spacing:0.01em;line-height:1.25\">担当するスタッフ<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;max-width:400px;font-size:14px;line-height:2;color:#4A4E58\">全員が宅地建物取引士。担当エリアを固定し、そのエリアの取引だけを追い続けています。<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px\">\n      <div>\n        <div style=\"position:relative;width:100%;aspect-ratio:3/4;background:#F5F6F8\">\n          <image-slot id=\"ths-staff-1\" shape=\"rect\" fit=\"cover\" src=\"80c92823-a310-418a-b71e-cf4cbdfa1a11\" placeholder=\"顔写真\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div style=\"font-size:10px;letter-spacing:0.2em;color:#1F4FD8;margin-top:18px\">CHIEF / 港区・千代田区<\u002Fdiv>\n        <div style=\"font-size:21px;font-weight:700;margin-top:10px;letter-spacing:0.02em\">佐久間 遼<\u002Fdiv>\n        <div style=\"font-size:10px;letter-spacing:0.18em;color:#797E8A;margin-top:6px\">RYO SAKUMA<\u002Fdiv>\n        <p style=\"margin:14px 0 0;font-size:13px;line-height:2;color:#4A4E58\">資産組替えのご相談を中心に担当。売却と購入の同時進行、決済日の調整までお任せください。<\u002Fp>\n        <div style=\"margin-top:14px;font-size:11px;color:#797E8A\">在籍11年／年間相談 180件<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"position:relative;width:100%;aspect-ratio:3/4;background:#F5F6F8\">\n          <image-slot id=\"ths-staff-2\" shape=\"rect\" fit=\"cover\" src=\"23257b86-13dc-45a6-8dc0-30cbba7e7374\" placeholder=\"顔写真\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div style=\"font-size:10px;letter-spacing:0.2em;color:#1F4FD8;margin-top:18px\">SENIOR / 渋谷区・目黒区<\u002Fdiv>\n        <div style=\"font-size:21px;font-weight:700;margin-top:10px;letter-spacing:0.02em\">三宅 里佳<\u002Fdiv>\n        <div style=\"font-size:10px;letter-spacing:0.18em;color:#797E8A;margin-top:6px\">RIKA MIYAKE<\u002Fdiv>\n        <p style=\"margin:14px 0 0;font-size:13px;line-height:2;color:#4A4E58\">恵比寿・中
