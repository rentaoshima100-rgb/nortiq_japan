  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

; font-size: 22px; color: #0B3B36; letter-spacing: 0.02em;\">メディ<\u002Fspan>\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" style=\"margin: 0 5px; flex-shrink: 0;\">\n            <rect x=\"9.5\" y=\"1\" width=\"5\" height=\"22\" rx=\"2.5\" fill=\"#0E8A7B\"><\u002Frect>\n            <rect x=\"1\" y=\"9.5\" width=\"22\" height=\"5\" rx=\"2.5\" fill=\"#0E8A7B\"><\u002Frect>\n          <\u002Fsvg>\n          <span style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; white-space: nowrap; flex-shrink: 0; font-size: 22px; color: #0B3B36; letter-spacing: 0.02em;\">キャリア<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size: 10.5px; color: #6E8F8A; letter-spacing: 0.08em;\">看護師専門の転職エージェント<\u002Fspan>\n      <\u002Fdiv>\n      <nav style=\"display: flex; gap: 28px; font-size: 14.5px; font-weight: 500; margin-left: 8px; white-space: nowrap; min-width: 0; flex-wrap: wrap; max-height: 26px; overflow: hidden;\">\n        <a href=\"#reasons\" style=\"color: #35564F;\">選ばれる理由<\u002Fa>\n        <a href=\"#flow\" style=\"color: #35564F;\">転職の流れ<\u002Fa>\n        <a href=\"#advisors\" style=\"color: #35564F;\">アドバイザー<\u002Fa>\n        <a href=\"#voices\" style=\"color: #35564F;\">転職事例<\u002Fa>\n        <a href=\"#search\" style=\"color: #35564F;\">求人を探す<\u002Fa>\n      <\u002Fnav>\n      <div style=\"margin-left: auto; display: flex; align-items: center; gap: 12px; flex-shrink: 0; white-space: nowrap;\">\n        <sc-if value=\"{{ showLineCta }}\" hint-placeholder-val=\"{{ true }}\">\n          <a href=\"#contact\" style=\"display: flex; align-items: center; gap: 7px; height: 46px; flex-shrink: 0; white-space: nowrap; padding: 0 18px; border-radius: 23px; border: 1.5px solid #CDE6E0; color: #0B6D61; font-size: 14px; font-weight: 700; background: #fff;\" style-hover=\"border-color: #0E8A7B; background: #F2F8F6;\">\n            <span style=\"width: 20px; height: 20px; border-radius: 6px; background: #06C755; color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; line-height: 1;\">L<\u002Fspan>\n            LINEで相談\n          <\u002Fa>\n        <\u002Fsc-if>\n        <a href=\"#contact\" style=\"display: flex; align-items: center; height: 46px; flex-shrink: 0; white-space: nowrap; padding: 0 24px; border-radius: 23px; background: #0E8A7B; color: #fff; font-size: 14.5px; font-weight: 700; box-shadow: 0 6px 16px rgba(14,138,123,0.24);\" style-hover=\"background: #0B6D61;\">無料で相談する<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"background: linear-gradient(180deg, #F4FAF8 0%, #FFFFFF 100%);\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 76px 32px 0; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: 64px; align-items: center;\">\n      <div>\n        <div style=\"display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; border-radius: 999px; background: #E3F2EE; color: #0B6D61; font-size: 13px; font-weight: 700; letter-spacing: 0.02em; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">\n          看護師・准看護師・保健師の転職支援\n        <\u002Fdiv>\n        <h1 style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: clamp(34px, 4.2vw, 60px); line-height: 1.34; letter-spacing: 0.01em; color: #0B3B36; margin: 24px 0 0;\">看護師の転職、<br>妥協しない。<\u002Fh1>\n        <p style=\"font-size: 17px; line-height: 2.05; color: #47645F; margin: 24px 0 0; max-width: 520px; text-wrap: pretty;\">給与も、夜勤の回数も、通勤時間も。どれかを諦める前に、一度話してみませんか。医療現場を知るアドバイザーが、あなたの条件を整理するところから一緒に考えます。<\u002Fp>\n        <div style=\"display: flex; gap: 14px; margin-top: 36px; flex-wrap: wrap;\">\n          <a href=\"#contact\" style=\"display: flex; align-items: center; justify-content: center; height: 62px; padding: 0 38px; border-radius: 31px; background: #0E8A7B; color: #fff; font-size: 17px; font-weight: 700; box-shadow: 0 10px 24px rgba(14,138,123,0.26);\" style-hover=\"background: #0B6D61;\">無料相談を申し込む<\u002Fa>\n          <sc-if value=\"{{ showLineCta }}\" hint-placeholder-val=\"{{ true }}\">\n            <a href=\"#contact\" style=\"display: flex; align-items: center; justify-content: center; gap: 10px; height: 62px; padding: 0 30px; border-radius: 31px; background: #fff; border: 1.5px solid #CDE6E0; color: #0B3B36; font-size: 16px; font-weight: 700;\" style-hover=\"border-color: #06C755;\">\n              <span style=\"width: 24px; height: 24px; border-radius: 7px; background: #06C755; color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; line-height: 1;\">L<\u002Fspan>\n              LINEで気軽に相談\n            <\u002Fa>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 18px; margin-top: 22px; font-size: 13.5px; color: #6E8F8A;\">\n          <span>相談は何度でも無料<\u002Fspan>\n          <span style=\"width: 4px; height: 4px; border-radius: 2px; background: #C3DCD6;\"><\u002Fspan>\n          <span>登録後にしつこい営業電話はしません<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position: relative; min-width: 0; padding-bottom: 76px;\">\n        <image-slot id=\"hero-nurse\" src=\"812bb680-a7de-4ba9-b10a-e486e9297186\" fit=\"cover\" mask=\"{{ heroMask }}\" placeholder=\"白衣の看護師の写真（縦長・人物中心／目安 620×720px）\" style=\"width: 100%; height: 560px;\"><\u002Fimage-slot>\n        <div style=\"position: absolute; left: -28px; bottom: 24px; background: #fff; border-radius: 20px; padding: 18px 24px; box-shadow: 0 14px 34px rgba(11,59,54,0.13); display: flex; align-items: center; gap: 16px;\">\n          <div style=\"width: 46px; height: 46px; border-radius: 15px; background: #E3F2EE; color: #0E8A7B; display: grid; place-items: center; font-size: 20px; font-weight: 700;\">夜<\u002Fdiv>\n          <div>\n            <div style=\"font-size: 15px; font-weight: 700; color: #0B3B36;\">夜間・休日の面談に対応<\u002Fdiv>\n            <div style=\"font-size: 13px; color: #6E8F8A;\">平日は21時まで／土日も相談可<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showStats }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"max-width: 1200px; margin: 0 auto; padding: 0 32px 76px;\">\n        <div style=\"background: #fff; border: 1px solid #E4F0EC; border-radius: 24px; padding: 34px 20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); box-shadow: 0 10px 30px rgba(11,59,54,0.06);\">\n          <div style=\"text-align: center; border-right: 1px solid #EDF5F3; padding: 0 16px;\">\n            <div style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 38px; color: #0E8A7B; line-height: 1.2;\">32,000<span style=\"font-size: 18px; margin-left: 3px;\">名<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size: 13.5px; color: #6E8F8A; margin-top: 4px;\">累計の支援実績<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align: center; border-right: 1px solid #EDF5F3; padding: 0 16px;\">\n            <div style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 38px; color: #0E8A7B; line-height: 1.2;\">48,000<span style=\"font-size: 18px; margin-left: 3px;\">件<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size: 13.5px; color: #6E8F8A; margin-top: 4px;\">看護師求人の掲載数<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align: center; border-right: 1px solid #EDF5F3; padding: 0 16px;\">\n            <div style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 38px; color: #0E8A7B; line-height: 1.2;\">約7<span style=\"font-size: 18px; margin-left: 3px;\">割<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size: 13.5px; color: #6E8F8A; margin-top: 4px;\">非公開求人の割合<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align: center; padding: 0 16px;\">\n            <div style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 38px; color: #0E8A7B; line-height: 1.2;\">96<span style=\"font-size: 18px; margin-left: 3px;\">%<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size: 13.5px; color: #6E8F8A; margin-top: 4px;\">面談後の満足度<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <section id=\"search\" style=\"max-width: 1200px; margin: 0 auto; padding: 20px 32px 96px;\">\n    <div style=\"background: #0E8A7B; border-radius: 32px; padding: 48px 52px; color: #fff;\">\n      <div style=\"display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;\">\n        <h2 style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 30px; margin: 0; letter-spacing: 0.01em;\">まずは求人を見てみる<\u002Fh2>\n        <span style=\"font-size: 14.5px; color: #C9E8E2;\">職種とエリアを選ぶだけ。会員登録なしで検索できます。<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 16px; margin-top: 28px; align-items: end;\">\n        <div>\n          <label style=\"display: block; font-size: 13.5px; font-weight: 700; color: #C9E8E2; margin-bottom: 8px;\">職種<\u002Flabel>\n          <sc-raw-select style=\"width: 100%; height: 62px; border-radius: 16px; border: none; padding: 0 20px; font-size: 16px; font-weight: 500; color: #1F3B38; background: #fff; appearance: none; background-image: linear-gradient(45deg, transparent 50%, #0E8A7B 50%), linear-gradient(135deg, #0E8A7B 50%, transparent 50%); background-position: calc(100% - 26px) 27px, calc(100% - 20px) 27px; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat;\">\n            <option>看護師（正看護師）<\u002Foption>\n            <option>准看護師<\u002Foption>\n            <option>保健師<\u002Foption>\n            <option>助産師<\u002Foption>\n            <option>すべての職種<\u002Foption>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div>\n          <label style=\"display: block; font-size: 13.5px; font-weight: 700; color: #C9E8E2; margin-bottom: 8px;\">エリア<\u002Flabel>\n          <sc-raw-select style=\"width: 100%; height: 62px; border-radius: 16px; border: none; padding: 0 20px; font-size: 16px; font-weight: 500; color: #1F3B38; background: #fff; appearance: none; background-image: linear-gradient(45deg, transparent 50%, #0E8A7B 50%), linear-gradient(135deg, #0E8A7B 50%, transparent 50%); background-position: calc(100% - 26px) 27px, calc(100% - 20px) 27px; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat;\">\n            <option>東京都<\u002Foption>\n            <option>神奈川県<\u002Foption>\n            <option>埼玉県<\u002Foption>\n            <option>千葉県<\u002Foption>\n            <option>大阪府<\u002Foption>\n            <option>愛知県<\u002Foption>\n            <option>福岡県<\u002Foption>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <a href=\"#search\" style=\"display: flex; align-items: center; justify-content: center; height: 62px; padding: 0 44px; border-radius: 16px; background: #0B3B36; color: #fff; font-size: 16.5px; font-weight: 700; white-space: nowrap;\" style-hover=\"background: #072925;\">求人を探す<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: 10px; margin-top: 26px; flex-wrap: wrap;\">\n        <span style=\"font-size: 13.5px; color: #C9E8E2; margin-right: 4px;\">人気の条件<\u002Fspan>\n        <sc-for list=\"{{ tags }}\" as=\"tag\" hint-placeholder-count=\"6\">\n          <a href=\"#search\" style=\"padding: 9px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.45); color: #fff; font-size: 13.5px; font-weight: 500; white-space: nowrap;\" style-hover=\"background: rgba(255,255,255,0.16);\">{{ tag }}<\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"reasons\" style=\"max-width: 1200px; margin: 0 auto; padding: 0 32px 100px;\">\n    <div style=\"text-align: center;\">\n      <div style=\"font-size: 13.5px; font-weight: 700; color: #0E8A7B; letter-spacing: 0.14em;\">WHY MEDICAREER<\u002Fdiv>\n      <h2 style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 40px; color: #0B3B36; margin: 14px 0 0; letter-spacing: 0.01em;\">選ばれている、3つの理由<\u002Fh2>\n      <p style=\"font-size: 16px; color: #5B7A76; margin: 16px 0 0;\">医療の現場に合わせた進め方だから、働きながらでも無理なく転職できます。<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; margin-top: 52px;\">\n      <div style=\"background: #F7FBFA; border: 1px solid #E4F0EC; border-radius: 26px; padding: 40px 34px;\">\n        <div style=\"width: 60px; height: 60px; border-radius: 20px; background: #0E8A7B; color: #fff; display: grid; place-items: center; font-family: 'Zen Maru Gothic', sans-serif; font-size: 24px; font-weight: 900;\">医<\u002Fdiv>\n        <h3 style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 22px; color: #0B3B36; margin: 24px 0 0;\">医療業界だけを、20年<\u002Fh3>\n        <p style=\"font-size: 15px; line-height: 2; color: #4F6C67; margin: 14px 0 0;\">病棟の配置基準も、診療科ごとの働き方の違いも前提として話せます。元看護師のアドバイザーが在籍し、現場の言葉のまま相談できます。<\u002Fp>\n        <div style=\"margin-top: 22px; padding-top: 20px; border-top: 1px dashed #D6E8E3; font-size: 13.5px; color: #6E8F8A;\">医療機関との取引 4,200施設<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #F7FBFA; border: 1px solid #E4F0EC; border-radius: 26px; padding: 40px 34px;\">\n        <div style=\"width: 60px; height: 60px; border-radius: 20px; background: #0E8A7B; color: #fff; display: grid; place-items: center; font-family: 'Zen Maru Gothic', sans-serif; font-size: 24px; font-weight: 900;\">非<\u002Fdiv>\n        <h3 style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 22px; color: #0B3B36; margin: 24px 0 0;\">公開されない求人が、約7割<\u002Fh3>\n        <p style=\"font-size: 15px; line-height: 2; color: #4F6C67; margin: 14px 0 0;\">欠員の補充や増床にともなう募集は、公開されないまま決まることがあります。条件をうかがったうえで、該当する求人だけをお渡しします。<\u002Fp>\n        <div style=\"margin-top: 22px; padding-top: 20px; border-top: 1px dashed #D6E8E3; font-size: 13.5px; color: #6E8F8A;\">非公開求人 約33,000件<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #F7FBFA; border: 1px solid #E4F0EC; border-radius: 26px; padding: 40px 34px;\">\n        <div style=\"width: 60px; height: 60px; border-radius: 20px; background: #0E8A7B; color: #fff; display: grid; place-items: center; font-family: 'Zen Maru Gothic', sans-serif; font-size: 24px; font-weight: 900;\">夜<\u002Fdiv>\n        <h3 style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 22px; color: #0B3B36; margin: 24px 0 0;\">夜間・休日の面談ができる<\u002Fh3>\n        <p style=\"font-size: 15px; line-height: 2; color: #4F6C67; margin: 14px 0 0;\">面談は平日21時まで、土日も対応しています。夜勤明けや勤務の合間でも、オンラインか電話で30分から相談できます。<\u002Fp>\n        <div style=\"margin-top: 22px; padding-top: 20px; border-top: 1px dashed #D6E8E3; font-size: 13.5px; color: #6E8F8A;\">オンライン／電話／来社から選べます<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"flow\" style=\"background: #F4FAF8; padding: 96px 0;\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 0 32px;\">\n      <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; flex-wrap: wrap;\">\n        <div>\n          <div style=\"font-size: 13.5px; font-weight: 700; color: #0E8A7B; letter-spacing: 0.14em;\">FLOW<\u002Fdiv>\n          <h2 style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 40px; color: #0B3B36; margin: 14px 0 0;\">転職成功までの流れ<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size: 15px; color: #5B7A76; max-width: 420px; margin: 0;\">ご相談から入職まで、平均で1〜3か月ほど。急がない転職も、時期を決めた転職も、ペースに合わせて進めます。<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px; margin-top: 56px;\">\n        <sc-for list=\"{{ steps }}\" as=\"step\" hint-placeholder-count=\"5\">\n          <div style=\"background: #fff; border-radius: 22px; padding: 32px 24px 28px; border: 1px solid #E4F0EC; display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"display: flex; align-items: center; gap: 10px;\">\n              <span style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 30px; color: #0E8A7B; line-height: 1;\">{{ step.no }}<\u002Fspan>\n              <span style=\"flex: 1; height: 1px; background: #DCEAE6;\"><\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 18px; color: #0B3B36; margin: 0;\">{{ step.title }}<\u002Fh3>\n            <p style=\"font-size: 14px; line-height: 1.95; color: #4F6C67; margin: 0;\">{{ step.body }}<\u002Fp>\n            <div style=\"margin-top: auto; padding-top: 14px; font-size: 12.5px; color: #8AA9A4;\">{{ step.meta }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top: 28px; background: #fff; border: 1px solid #E4F0EC; border-radius: 20px; padding: 22px 30px; display: flex; align-items: center; gap: 16px; font-size: 14.5px; color: #4F6C67;\">\n        <span style=\"width: 30px; height: 30px; border-radius: 10px; background: #E3F2EE; color: #0E8A7B; display: grid; place-items: center; font-size: 15px; font-weight: 700; flex-shrink: 0;\">¥<\u002Fspan>\n        費用は入職後も含めて一切かかりません。求人紹介・書類添削・面接調整まで、すべて無料でご利用いただけます。\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"advisors\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 32px;\">\n    <div style=\"text-align: center;\">\n      <div style=\"font-size: 13.5px; font-weight: 700; color: #0E8A7B; letter-spacing: 0.14em;\">ADVISORS<\u002Fdiv>\n      <h2 style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 40px; color: #0B3B36; margin: 14px 0 0;\">担当するキャリアアドバイザー<\u002Fh2>\n      <p style=\"font-size: 16px; color: #5B7A76; margin: 16px 0 0;\">臨床経験者を含む担当が、希望エリアと診療科に合わせてつきます。<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; margin-top: 52px;\">\n      <div style=\"border: 1px solid #E4F0EC; border-radius: 26px; overflow: hidden; background: #fff;\">\n        <image-slot id=\"advisor-1\" shape=\"rect\" src=\"ea3f98b1-1a4d-462f-970d-18f6b8ab5990\" fit=\"cover\" placeholder=\"アドバイザー写真（正面・上半身／目安 720×560px）\" style=\"width: 100%; height: 260px;\"><\u002Fimage-slot>\n        <div style=\"padding: 28px 30px 32px;\">\n          <div style=\"display: inline-flex; padding: 5px 12px; border-radius: 999px; background: #E3F2EE; color: #0B6D61; font-size: 12.5px; font-weight: 700;\">元・急性期病棟 看護師<\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 10px; margin-top: 14px;\">\n            <span style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 22px; color: #0B3B36;\">佐藤 美咲<\u002Fspan>\n            <span style=\"font-size: 12.5px; color: #8AA9A4;\">首都圏／急性期・救急<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 14.5px; line-height: 1.95; color: #4F6C67; margin: 14px 0 0;\">7年間、救命救急センターで勤務していました。夜勤の負担や人員配置の実際について、経験をふまえてお話しします。<\u002Fp>\n          <div style=\"margin-top: 20px; padding-top: 18px; border-top: 1px solid #EDF5F3; font-size: 13px; color: #6E8F8A;\">支援実績 1,180名／担当歴 6年<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid #E4F0EC; border-radius: 26px; overflow: hidden; background: #fff;\">\n        <image-slot id=\"advisor-2\" shape=\"rect\" src=\"4a37f5be-383c-4367-8f9c-800586013e3d\" fit=\"cover\" placeholder=\"アドバイザー写真（正面・上半身／目安 720×560px）\" style=\"width: 100%; height: 260px;\"><\u002Fimage-slot>\n        <div style=\"padding: 28px 30px 32px;\">\n          <div style=\"display: inline-flex; padding: 5px 12px; border-radius: 999px; background: #E3F2EE; color: #0B6D61; font-size: 12.5px; font-weight: 700;\">クリニック・訪問看護 担当<\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 10px; margin-top: 14px;\">\n            <span style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 22px; color: #0B3B36;\">田中 亮介<\u002Fspan>\n            <span style=\"font-size: 12.5px; color: #8AA9A4;\">関西／外来・在宅<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 14.5px; line-height: 1.95; color: #4F6C67; margin: 14px 0 0;\">日勤のみへの働き方の切り替えや、育児と両立できる勤務時間の調整を中心にご相談を受けています。<\u002Fp>\n          <div style=\"margin-top: 20px; padding-top: 18px; border-top: 1px solid #EDF5F3; font-size: 13px; color: #6E8F8A;\">支援実績 940名／担当歴 5年<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid #E4F0EC; border-radius: 26px; overflow: hidden; background: #fff;\">\n        <image-slot id=\"advisor-3\" shape=\"rect\" src=\"786e9d34-7ccb-4671-a048-f7b85ee836a2\" fit=\"cover\" placeholder=\"アドバイザー写真（正面・上半身／目安 720×560px）\" style=\"width: 100%; height: 260px;\"><\u002Fimage-slot>\n        <div style=\"padding: 28px 30px 32px;\">\n          <div style=\"display: inline-flex; padding: 5px 12px; border-radius: 999px; background: #E3F2EE; color: #0B6D61; font-size: 12.5px; font-weight: 700;\">ブランク・復職 担当<\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 10px; margin-top: 14px;\">\n            <span style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 22px; color: #0B3B36;\">小林 千尋<\u002Fspan>\n            <span style=\"font-size: 12.5px; color: #8AA9A4;\">全国／復職支援・准看護師<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 14.5px; line-height: 1.95; color: #4F6C67; margin: 14px 0 0;\">数年のブランクがある方の復職を担当しています。研修体制の整った職場から、無理のない範囲でご提案します。<\u002Fp>\n          <div style=\"margin-top: 20px; padding-top: 18px; border-top: 1px solid #EDF5F3; font-size: 13px; color: #6E8F8A;\">支援実績 760名／担当歴 4年<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"voices\" style=\"background: #F4FAF8; padding: 96px 0;\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 0 32px;\">\n      <div style=\"font-size: 13.5px; font-weight: 700; color: #0E8A7B; letter-spacing: 0.14em;\">CASES<\u002Fdiv>\n      <h2 style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 40px; color: #0B3B36; margin: 14px 0 0;\">転職された方の事例<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: 48px;\">\n        <sc-for list=\"{{ cases }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <div style=\"background: #fff; border: 1px solid #E4F0EC; border-radius: 24px; padding: 34px 32px; display: flex; flex-direction: column;\">\n            <div style=\"font-size: 13px; color: #6E8F8A;\">{{ c.who }}<\u002Fdiv>\n            <p style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 19px; line-height: 1.75; color: #0B3B36; margin: 12px 0 0; text-wrap: pretty;\">{{ c.quote }}<\u002Fp>\n            <p style=\"font-size: 14.5px; line-height: 1.95; color: #4F6C67; margin: 16px 0 0;\">{{ c.body }}<\u002Fp>\n            <div style=\"margin-top: 24px; padding-top: 20px; border-top: 1px solid #EDF5F3; display: flex; align-items: center; gap: 12px; font-size: 13.5px;\">\n              <span style=\"color: #8AA9A4;\">{{ c.before }}<\u002Fspan>\n              <span style=\"color: #0E8A7B; font-weight: 700;\">→<\u002Fspan>\n              <span style=\"color: #0B3B36; font-weight: 700;\">{{ c.after }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"contact\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 32px;\">\n    <div style=\"display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); gap: 56px; align-items: start;\">\n      <div>\n        <div style=\"font-size: 13.5px; font-weight: 700; color: #0E8A7B; letter-spacing: 0.14em;\">CONTACT<\u002Fdiv>\n        <h2 style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 40px; color: #0B3B36; margin: 14px 0 0; line-height: 1.4;\">まずは60分、<br>話を聞かせてください。<\u002Fh2>\n        <p style=\"font-size: 16px; line-height: 2.05; color: #4F6C67; margin: 22px 0 0;\">転職するかどうか決まっていない段階でも構いません。今の職場の状況をうかがったうえで、選択肢を整理します。ご相談内容を現在の勤務先に伝えることはありません。<\u002Fp>\n        <div style=\"margin-top: 32px; display: flex; flex-direction: column; gap: 14px;\">\n          <div style=\"display: flex; align-items: center; gap: 12px; font-size: 15px; color: #35564F;\"><span style=\"width: 26px; height: 26px; border-radius: 9px; background: #E3F2EE; color: #0E8A7B; display: grid; place-items: center; font-size: 13px; font-weight: 700;\">✓<\u002Fspan>相談・紹介・入職後のフォローまで完全無料<\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 12px; font-size: 15px; color: #35564F;\"><span style=\"width: 26px; height: 26px; border-radius: 9px; background: #E3F2EE; color: #0E8A7B; display: grid; place-items: center; font-size: 13px; font-weight: 700;\">✓<\u002Fspan>平日21時まで／土日もオンラインで対応<\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 12px; font-size: 15px; color: #35564F;\"><span style=\"width: 26px; height: 26px; border-radius: 9px; background: #E3F2EE; color: #0E8A7B; display: grid; place-items: center; font-size: 13px; font-weight: 700;\">✓<\u002Fspan>個人情報は同意なく医療機関へ開示しません<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showLineCta }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top: 32px; background: #F7FBFA; border: 1px solid #E4F0EC; border-radius: 22px; padding: 26px 28px; display: flex; align-items: center; gap: 20px;\">\n            <div style=\"width: 52px; height: 52px; border-radius: 17px; background: #06C755; color: #fff; display: grid; place-items: center; font-size: 22px; font-weight: 700; flex-shrink: 0;\">L<\u002Fdiv>\n            <div style=\"flex: 1;\">\n              <div style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 17px; color: #0B3B36;\">LINEでのやりとりも選べます<\u002Fdiv>\n              <div style=\"font-size: 13.5px; color: #6E8F8A; margin-top: 2px;\">求人の共有も面談の日程調整もLINEで完結します<\u002Fdiv>\n            <\u002Fdiv>\n            <a href=\"#contact\" style=\"padding: 12px 22px; border-radius: 999px; background: #06C755; color: #fff; font-size: 14px; font-weight: 700; white-space: nowrap;\" style-hover=\"background: #05A948;\">友だち追加<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"background: #F7FBFA; border: 1px solid #E4F0EC; border-radius: 28px; padding: 42px 44px;\">\n        <div style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 21px; color: #0B3B36;\">無料相談フォーム<\u002Fdiv>\n        <div style=\"font-size: 13.5px; color: #6E8F8A; margin-top: 6px;\">入力は1分ほど。2営業日以内にご連絡します。<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 28px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px; min-width: 0;\">\n            <label style=\"font-size: 13.5px; font-weight: 700; color: #35564F;\">お名前<span style=\"color: #C0554A; margin-left: 4px;\">必須<\u002Fspan><\u002Flabel>\n            <input type=\"text\" placeholder=\"山田 花子\" style=\"height: 54px; width: 100%; min-width: 0; box-sizing: border-box; border-radius: 14px; border: 1px solid #DCEAE6; background: #fff; padding: 0 16px; font-size: 15px; font-family: inherit; color: #1F3B38;\">\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; min-width: 0;\">\n            <label style=\"font-size: 13.5px; font-weight: 700; color: #35564F;\">保有資格<span style=\"color: #C0554A; margin-left: 4px;\">必須<\u002Fspan><\u002Flabel>\n            <sc-raw-select style=\"height: 54px; width: 100%; min-width: 0; box-sizing: border-box; border-radius: 14px; border: 1px solid #DCEAE6; background: #fff; padding: 0 16px; u002Fdiv>\n          <div style=\"grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px;\">\n            <label style=\"font-size: 13.5px; font-weight: 700; color: #35564F;\">相談したいこと（任意）<\u002Flabel>\n            <textarea placeholder=\"夜勤の回数を減らしたい、通勤時間を短くしたい など\" style=\"height: 96px; width: 100%; min-width: 0; box-sizing: border-box; border-radius: 14px; border: 1px solid #DCEAE6; background: #fff; padding: 14px 16px; font-size: 15px; font-family: inherit; color: #1F3B38; resize: none; line-height: 1.8;\"><\u002Ftextarea>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <a href=\"#contact\" style=\"display: flex; align-items: center; justify-content: center; height: 62px; margin-top: 26px; border-radius: 18px; background: #0E8A7B; color: #fff; font-size: 17px; font-weight: 700; box-shadow: 0 10px 24px rgba(14,138,123,0.24);\" style-hover=\"background: #0B6D61;\">同意して無料相談を申し込む<\u002Fa>\n        <div style=\"font-size: 12.5px; color: #8AA9A4; margin-top: 14px; line-height: 1.85;\">送信により<a href=\"#contact\" style=\"color: #0B6D61; text-decoration: underline;\">個人情報の取り扱い<\u002Fa>に同意したものとみなします。<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background: #0B3B36; color: #C9E8E2; padding: 64px 0 36px;\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 0 32px; display: grid; grid-template-columns: minmax(0, 1.2fr) repeat(3, minmax(0, 1fr)); gap: 40px;\">\n      <div>\n        <div style=\"display: flex; align-items: center; white-space: nowrap;\">\n          <span style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; white-space: nowrap; flex-shrink: 0; font-size: 22px; color: #fff; letter-spacing: 0.02em;\">メディ<\u002Fspan>\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" style=\"margin: 0 5px; flex-shrink: 0;\">\n            <rect x=\"9.5\" y=\"1\" width=\"5\" height=\"22\" rx=\"2.5\" fill=\"#ffffff\"><\u002Frect>\n            <rect x=\"1\" y=\"9.5\" width=\"22\" height=\"5\" rx=\"2.5\" fill=\"#ffffff\"><\u002Frect>\n          <\u002Fsvg>\n          <span style=\"font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; white-space: nowrap; flex-shrink: 0; font-size: 22px; color: #fff; letter-spacing: 0.02em;\">キャリア<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size: 13.5px; line-height: 1.95; margin: 18px 0 0; color: #9FC7C0; max-width: 280px;\">看護師専門の転職エージェント。医療機関の紹介から入職後のフォローまで無料で支援しています。<\u002Fp>\n        <div style=\"margin-top: 24px; display: inline-flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid #235C55; border-radius: 14px;\">\n          <div style=\"width: 40px; height: 40px; border-radius: 8px; border: 1.5px solid #6FA9A1; display: grid; place-items: center; font-size: 9px; font-weight: 700; color: #C9E8E2; line-height: 1.2; text-align: center;\">P<br>MARK<\u002Fdiv>\n          <div style=\"font-size: 12px; color: #9FC7C0; line-height: 1.7;\">プライバシーマーク取得<br>第10000000（00）号<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size: 14px; font-weight: 700; color: #fff;\">サービス<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px; margin-top: 18px; font-size: 13.5px;\">\n          <a href=\"#search\" style=\"color: #9FC7C0;\">求人を探す<\u002Fa>\n          <a href=\"#reasons\" style=\"color: #9FC7C0;\">選ばれる理由<\u002Fa>\n          <a href=\"#flow\" style=\"color: #9FC7C0;\">転職の流れ<\u002Fa>\n          <a href=\"#advisors\" style=\"color: #9FC7C0;\">アドバイザー紹介<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size: 14px; font-weight: 700; color: #fff;\">職種から探す<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px; margin-top: 18px; font-size: 13.5px;\">\n          <a href=\"#search\" style=\"color: #9FC7C0;\">正看護師<\u002Fa>\n          <a href=\"#search\" style=\"color: #9FC7C0;\">准看護師<\u002Fa>\n          <a href=\"#search\" style=\"color: #9FC7C0;\">保健師<\u002Fa>\n          <a href=\"#search\" style=\"color: #9FC7C0;\">助産師<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size: 14px; font-weight: 700; color: #fff;\">運営情報<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px; margin-top: 18px; font-size: 13.5px;\">\n          <a href=\"#contact\" style=\"color: #9FC7C0;\">運営会社<\u002Fa>\n          <a href=\"#contact\" style=\"color: #9FC7C0;\">個人情報の取り扱い<\u002Fa>\n          <a href=\"#contact\" style=\"color: #9FC7C0;\">利用規約<\u002Fa>\n          <a href=\"#contact\" style=\"color: #9FC7C0;\">お問い合わせ<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width: 1200px; margin: 44px auto 0; padding: 22px 32px 0; border-top: 1px solid #1B4F49; font-size: 12.5px; color: #7FB3AC;\">© 2026 MediCareer Inc.<\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showLineCta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;導線&quot;},&quot;showStats&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;導線&quot;},&quot;heroPhotoShape&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;やわらかい角丸&quot;,&quot;アーチ&quot;,&quot;円形&quot;],&quot;default&quot;:&quot;やわらかい角丸&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;ヒーロー&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const shape = this.props.heroPhotoShape ?? \"やわらかい角丸\";\n    const masks = {\n      \"やわらかい角丸\": \"inset(0 round 32px)\",\n      \"アーチ\": \"inset(0 round 260px 260px 32px 32px)\",\n      \"円形\": \"circle(50% at 50% 50%)\"\n    };\n    return {\n      heroMask: masks[shape] ?? masks[\"やわらかい角丸\"],\n      showLineCta: this.props.showLineCta ?? true,\n      showStats: this.props.showStats ?? true,\n      tags: [\"日勤のみ\", \"夜勤なし\", \"ブランクOK\", \"訪問看護\", \"オペ室\", \"駅から徒歩10分以内\"],\n      slots: [\"午前（9-12時）\", \"午後（12-17時）\", \"夕方以降（17-21時）\", \"土日\"],\n      steps: [\n        { no: \"01\", title: \"無料相談\", body: \"希望条件と今の職場の状況をうかがいます。オンラインか電話で60分ほど。\", meta: \"所要 60分\" },\n        { no: \"02\", title: \"求人のご提案\", body: \"非公開求人を含め、条件に合う医療機関を3〜5件ほどお渡しします。\", meta: \"面談から2〜3日\" },\n        { no: \"03\", title: \"応募・書類準備\", body: \"職務経歴書の添削と、施設ごとの記載ポイントをお伝えします。\", meta: \"1週間程度\" },\n        { no: \"04\", title: \"面接・見学\", body: \"日程調整はすべて代行。ご希望があれば面接に同行します。\", meta: \"2〜4週間\" },\n        { no: \"05\", title: \"内定・入職後\", body: \"条件交渉と退職手続きの相談まで。入職後も3か月間フォローします。\", meta: \"入職後も継続\" }\n      ],\n      cases: [\n        {\n          who: \"30代・正看護師／急性期病棟\",\n          quote: \"夜勤を月4回に減らしても、収入は下げずに済みました。\",\n          body: \"月8回の夜勤が続き、体調を崩したことが相談のきっかけでした。夜勤回数を条件の軸に据えて探し、2か月で入職しています。\",\n          before: \"急性期病棟\",\n          after: \"回復期リハ病棟\"\n        },\n        {\n          who: \"40代・准看護師／ブランク3年\",\n          quote: \"研修のある職場を選べたので、復職の不安が減りました。\",\n          body: \"3年のブランクがあり、いきなり病棟に戻ることに不安がありました。教育体制を見学で確認したうえで決めています。\",\n          before: \"離職期間3年\",\n          after: \"内科クリニック\"\n        },\n        {\n          who: \"20代・正看護師／総合病院\",\n          quote: \"通勤が片道70分から20分になりました。\",\n          body: \"転居にあわせた転職でした。エリアと診療科の希望を先に固め、非公開求人の中から3件をご提案しています。\",\n          before: \"通勤70分\",\n          after: \"通勤20分\"\n        }\n      ]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
