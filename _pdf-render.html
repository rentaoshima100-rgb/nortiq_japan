<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>PDF render</title></head>
<body style="margin:0;background:#fff">
<div id="pages"></div>
<script type="module">
import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs';
const res = await fetch('uploads/ai-blog-tool.pdf');
const buf = await res.arrayBuffer();
const pdf = await pdfjs.getDocument({ data: new Uint8Array(buf) }).promise;
const container = document.getElementById('pages');
for (let i = 1; i <= pdf.numPages; i++) {
  const page = await pdf.getPage(i);
  const viewport = page.getViewport({ scale: 1.2 });
  const c = document.createElement('canvas');
  c.width = viewport.width;
  c.height = viewport.height;
  c.style.display = 'block';
  c.style.margin = '8px 0';
  c.style.border = '1px solid #ccc';
  await page.render({ canvasContext: c.getContext('2d'), viewport }).promise;
  container.appendChild(c);
}
window.__pdfDone = true;
</script>
</body>
</html>
