<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Loop AI 投稿アシスタント — デザイン比較</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
    body { font-family: "Noto Sans JP", -apple-system, sans-serif; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Design system / shared -->
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>

  <!-- Variations -->
  <script type="text/babel" src="variation-a.jsx"></script>
  <script type="text/babel" src="variation-b.jsx"></script>
  <script type="text/babel" src="variation-c.jsx"></script>

  <!-- App -->
  <script type="text/babel">

const { useState } = React;

function App() {
  return (
    <DesignCanvas>
          <DCSection
        id="intro"
        title="Loop AI 投稿アシスタント"
        subtitle="WordPressに代わるブログ投稿UI · 3パターン比較 · 非技術ユーザー向け">
        
            <DCArtboard
          id="a"
          label="A · クラシック分割（Notion風）"
          width={1280}
          height={820}>
          
              <VariationA />
            </DCArtboard>

            <DCArtboard
          id="b"
          label="B · ステップガイド型"
          width={1280}
          height={820}>
          
              <VariationB />
            </DCArtboard>

            <DCArtboard
          id="c"
          label="C · モバイル版（iPhone）"
          width={402}
          height={874}>
          
              <IOSDevice width={402} height={874}>
                <VariationC />
              </IOSDevice>
            </DCArtboard>
          </DCSection>

          <DCSection
        id="notes"
        title="デザインの考え方"
        subtitle="3パターンに共通する原則">
        
            <DCArtboard id="notes-1" label="設計メモ" width={1280} height={520}>
              <DesignNotes />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>);

}

// ===== デザイン解説カード =====
function DesignNotes() {
  const principles = [
  {
    n: "01",
    h: "「下書き → AIが整える → 公開」の流れを線で見せる",
    p: "8ステップを常に画面のどこかに表示。今どこにいて、あといくつあるかが一目でわかります。Aは上部ピル列、Bは大きなサイドバー、Cは細い進捗バー。"
  },
  {
    n: "02",
    h: "AIが「これでいいですか？」と必ず止まる",
    p: "勝手に投稿が進まないよう、要約フェーズで色付きカードを表示。チェックリスト形式で内容を確認 →「OK」か「直したい」の2択。誤投稿の不安を取り除きます。"
  },
  {
    n: "03",
    h: "プレビューを「ライブ」に",
    p: "チャットの編集がそのまま右側／下のタブに反映。技術用語は使わず、「公開後の見た目」と表記。スマホ表示の切り替えも1タップ。"
  },
  {
    n: "04",
    h: "SEOは点数 + チェックリスト + 競合分析の3層",
    p: "丸いスコアで全体感、◯△ で項目別、競合ブログの順位・文字数・スコアまで提示。「あと800語で上位を狙えそう」など、AIの具体的な提案で次の一手が明確に。"
  },
  {
    n: "05",
    h: "敬語で、急かさず、提案する",
    p: "「〜しましょうか」「〜してみますね」のトーンで統一。短縮ボタン（やわらかく言い換えて / 短い導入文を3案）でタイプ量を最小化。"
  },
  {
    n: "06",
    h: "Notion風の制約された美しさ",
    p: "色は白／温白／藍／AI紫の4色のみ。フォントは Noto Serif JP（見出し）と Noto Sans JP（本文）。「ループ」のロゴマークだけがアクセント。"
  }];

  return (
    <div
      className="lp-root"
      style={{
        width: "100%", height: "100%",
        background: "var(--bg)",
        padding: "32px 40px",
        overflowY: "auto"
      }}>
      
          <div style={{ display: "flex", alignItems: "flex-end", gap: 16, marginBottom: 24 }}>
            <div style={{ fontSize: 11, fontFamily: "var(--font-mono)", color: "var(--ink-soft)", fontWeight: 600, letterSpacing: "0.08em" }}>
              DESIGN PRINCIPLES
            </div>
            <div style={{ flex: 1, height: 1, background: "var(--border)", marginBottom: 6 }} />
            <div style={{ fontSize: 11, color: "var(--ink-soft)" }}>v0.1 · 2026.05</div>
          </div>
          <h1 style={{
        fontFamily: "var(--font-serif)",
        fontSize: 32,
        fontWeight: 600,
        margin: "0 0 8px",
        letterSpacing: "-0.01em"
      }}>
            「書ける気がしない」をなくす<span style={{ fontFamily: "var(--font-display)", fontStyle: "italic", color: "var(--brand)" }}>—— 6つの原則</span>
          </h1>
          <p style={{ fontSize: 14, color: "var(--ink-muted)", maxWidth: 720, marginBottom: 28 }}>
            記事を書いたことがない人でも、AIと話すだけで投稿が完成する。
            そのためにこの3パターン全てが守る、共通の設計ルールです。
          </p>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 14 }}>
            {principles.map((p) =>
        <div
          key={p.n}
          style={{
            border: "1px solid var(--border)",
            borderRadius: "var(--r-lg)",
            padding: "20px 22px",
            background: "var(--bg-soft)",
            position: "relative",
            overflow: "hidden"
          }}>
          
                <div
            style={{
              fontFamily: "var(--font-display)",
              fontStyle: "italic",
              fontSize: 44,
              color: "transparent",
              WebkitTextStroke: "1px var(--border-strong)",
              lineHeight: 1,
              position: "absolute",
              top: 14,
              right: 18
            }}>
            
                  {p.n}
                </div>
                <div style={{
            fontSize: 10.5,
            fontFamily: "var(--font-mono)",
            color: "var(--brand)",
            fontWeight: 600,
            marginBottom: 10
          }}>
                  {p.n}
                </div>
                <div style={{
            fontSize: 15,
            fontWeight: 600,
            lineHeight: 1.45,
            marginBottom: 8,
            fontFamily: "var(--font-serif)"
          }}>
                  {p.h}
                </div>
                <div style={{ fontSize: 12.5, color: "var(--ink-muted)", lineHeight: 1.7, fontFamily: "\"Times New Roman\"" }}>
                  {p.p}
                </div>
              </div>
        )}
          </div>
        </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
